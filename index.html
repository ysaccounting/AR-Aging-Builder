<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AR Aging Report</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Inter', sans-serif; background: #EAECF0; min-height: 100vh; display: flex;
    align-items: center; justify-content: center; padding: 2rem 1rem; color: #111; }
  .card { background: #fff; border-radius: 20px; box-shadow: 0 2px 8px rgba(0,0,0,.07), 0 8px 32px rgba(0,0,0,.09);
    width: 100%; max-width: 620px; overflow: hidden; }
  .card-body { padding: 2rem 2rem 1.75rem; }
  .card-title { font-size: 1.3rem; font-weight: 700; margin-bottom: .35rem; letter-spacing: -.01em; }
  .card-sub { font-size: .875rem; color: #6B7280; line-height: 1.6; margin-bottom: 1.6rem; }
  .section-label { font-size: .65rem; font-weight: 600; letter-spacing: 2px; text-transform: uppercase;
    color: #9CA3AF; margin-bottom: .5rem; }
  .section-label.spaced { margin-top: 1.3rem; }

  /* Select */
  .select-wrap { position: relative; }
  .select-wrap select { width: 100%; appearance: none; background: #F8F9FC; border: 2px solid #C4C9D8;
    border-radius: 10px; padding: .65rem 2.5rem .65rem .9rem; font-family: inherit; font-size: .9rem;
    color: #111; cursor: pointer; outline: none; transition: border-color .2s; }
  .select-wrap select:focus { border-color: #7B8DB0; }
  .select-wrap::after { content: '▾'; position: absolute; right: .9rem; top: 50%; transform: translateY(-50%);
    pointer-events: none; color: #6B7280; font-size: .85rem; }

  /* Text input */
  .text-input { width: 100%; background: #F8F9FC; border: 2px solid #C4C9D8; border-radius: 10px;
    padding: .65rem .9rem; font-family: inherit; font-size: .9rem; color: #111; outline: none;
    transition: border-color .2s; margin-top: .5rem; }
  .text-input:focus { border-color: #7B8DB0; }
  .text-input::placeholder { color: #9CA3AF; }

  /* Date input */
  input[type="date"] { width: 100%; background: #F8F9FC; border: 2px solid #C4C9D8; border-radius: 10px;
    padding: .65rem .9rem; font-family: inherit; font-size: .9rem; color: #111; outline: none;
    transition: border-color .2s; cursor: pointer; }
  input[type="date"]:focus { border-color: #7B8DB0; }

  /* Dropzone */
  .dropzone { border: 2px dashed #C4C9D8; border-radius: 12px; background: #F8F9FC; padding: 1.4rem 1.5rem;
    text-align: center; cursor: pointer; transition: border-color .2s, background .2s; position: relative; }
  .dropzone:hover, .dropzone.drag-over { border-color: #7B8DB0; background: #F0F3FA; }
  .dropzone input[type="file"] { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%; }
  .dropzone-text { font-size: .9rem; color: #374151; }
  .dropzone-text a { color: #4B6FBE; text-decoration: none; }
  .dropzone-text a:hover { text-decoration: underline; }
  .dropzone-hint { font-size: .78rem; color: #9CA3AF; margin-top: .25rem; }
  .file-list { display: flex; flex-direction: column; gap: .35rem; margin-top: .6rem; }
  .file-pill { display: flex; align-items: center; gap: .6rem; background: #F3F4F6; border-radius: 7px;
    padding: .4rem .7rem; font-size: .8rem; color: #374151; }
  .file-pill .fname { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .file-pill .remove { margin-left: auto; cursor: pointer; color: #9CA3AF; background: none; border: none;
    font-size: 1rem; line-height: 1; padding: 0 2px; }
  .file-pill .remove:hover { color: #374151; }

  /* Actions */
  .actions { display: flex; gap: .75rem; margin-top: 1.5rem; }
  .btn-process { flex: 1; background: #4B5563; color: #fff; border: none; border-radius: 8px; padding: .7rem 1.25rem;
    font-family: inherit; font-weight: 600; font-size: .9rem; cursor: pointer; display: flex; align-items: center;
    justify-content: center; gap: .5rem; transition: background .15s; }
  .btn-process:hover:not(:disabled) { background: #1F2937; }
  .btn-process:disabled { opacity: .55; cursor: not-allowed; }
  .btn-clear { background: #fff; color: #374151; border: 1px solid #D1D5DB; border-radius: 8px; padding: .7rem 1.25rem;
    font-family: inherit; font-weight: 500; font-size: .9rem; cursor: pointer; transition: background .15s, border-color .15s; }
  .btn-clear:hover { background: #F9FAFB; border-color: #9CA3AF; }
  .spinner { width: 16px; height: 16px; border: 2px solid rgba(255,255,255,.35); border-top-color: #fff;
    border-radius: 50%; animation: spin .7s linear infinite; display: none; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Results */
  .results { border-top: 1px solid #F3F4F6; }
  .download-wrap { padding: 1.25rem 2rem 1.5rem; }
  .report-meta { font-size: .83rem; color: #6B7280; margin-bottom: .85rem; display: flex; gap: 1.5rem; }
  .report-meta span strong { color: #111; }
  .btn-download { display: block; width: 100%; background: #374151; color: #fff; border: none; border-radius: 8px;
    padding: .7rem 1.25rem; font-family: inherit; font-weight: 600; font-size: .9rem; cursor: pointer;
    text-align: center; text-decoration: none; transition: background .15s; }
  .btn-download:hover { background: #1F2937; }
  .error-item { padding: 1rem 2rem; background: #FEF2F2; border-top: 1px solid #FECACA; }
  .error-item p { font-size: .85rem; color: #B91C1C; }
</style>
</head>
<body>
<div class="card">
  <div class="card-body">
    <div class="card-title">AR Aging Report</div>
    <div class="card-sub">Select a group, choose an As of Date, and upload an invoices export to generate the AR Aging workbook.</div>

    <div class="section-label">Group</div>
    <div class="select-wrap">
      <select id="groupSelect">
        <option value="Y&S Group">Y&amp;S Group</option>
        <option value="YS-SeatGeek">YS-SeatGeek</option>
        <option value="The Ticket Guy">The Ticket Guy</option>
        <option value="Other">Other</option>
      </select>
    </div>
    <div id="customGroupWrap" style="display:none;">
      <input type="text" id="customGroup" class="text-input" placeholder="Enter group name">
    </div>

    <div class="section-label spaced">As of Date</div>
    <input type="date" id="asOfDate" value="">

    <div class="section-label spaced">Invoices Export</div>
    <div class="dropzone" id="dzInvoices">
      <input type="file" accept=".xlsx">
      <div class="dropzone-text">Drag &amp; drop or <a href="#" class="browse">browse</a></div>
      <div class="dropzone-hint">Accepts .xlsx file</div>
    </div>
    <div class="file-list" id="fileList"></div>

    <div class="actions">
      <button class="btn-process" id="processBtn" disabled>
        <span id="btnLabel">Generate Report</span>
        <div class="spinner" id="spinner"></div>
      </button>
      <button class="btn-clear" id="clearBtn">Clear</button>
    </div>
  </div>
  <div class="results" id="results" style="display:none;"></div>
</div>

<script>
  // Set default date to today
  const today = new Date().toISOString().split('T')[0];
  document.getElementById('asOfDate').value = today;

  let invoiceFile = null;
  const processBtn = document.getElementById('processBtn');
  const btnLabel   = document.getElementById('btnLabel');
  const spinner    = document.getElementById('spinner');
  const resultsDiv = document.getElementById('results');
  const groupSelect    = document.getElementById('groupSelect');
  const customGroupWrap = document.getElementById('customGroupWrap');
  const customGroup    = document.getElementById('customGroup');

  // Show/hide custom group input
  groupSelect.addEventListener('change', () => {
    customGroupWrap.style.display = groupSelect.value === 'Other' ? 'block' : 'none';
    checkReady();
  });
  customGroup.addEventListener('input', checkReady);

  // Dropzone setup
  const dz    = document.getElementById('dzInvoices');
  const input = dz.querySelector('input[type="file"]');

  dz.addEventListener('dragover', e => { e.preventDefault(); dz.classList.add('drag-over'); });
  dz.addEventListener('dragleave', () => dz.classList.remove('drag-over'));
  dz.addEventListener('drop', e => {
    e.preventDefault(); dz.classList.remove('drag-over');
    const f = [...e.dataTransfer.files].find(f => /\.xlsx$/i.test(f.name));
    if (f) setFile(f);
  });
  input.addEventListener('change', () => { if (input.files[0]) setFile(input.files[0]); input.value = ''; });
  dz.querySelector('.browse').addEventListener('click', e => { e.preventDefault(); input.click(); });

  function setFile(f) {
    invoiceFile = f;
    const list = document.getElementById('fileList');
    list.innerHTML = '';
    const pill = document.createElement('div');
    pill.className = 'file-pill';
    pill.innerHTML = `<span class="fname">${f.name}</span><button class="remove" title="Remove">&times;</button>`;
    pill.querySelector('.remove').addEventListener('click', () => { invoiceFile = null; list.innerHTML = ''; checkReady(); });
    list.appendChild(pill);
    checkReady();
  }

  function checkReady() {
    const groupOk = groupSelect.value !== 'Other' || customGroup.value.trim() !== '';
    processBtn.disabled = !invoiceFile || !groupOk;
  }

  function money(n) {
    return Number(n).toLocaleString('en-US', { style: 'currency', currency: 'USD', maximumFractionDigits: 0 });
  }

  document.getElementById('clearBtn').addEventListener('click', () => {
    invoiceFile = null;
    document.getElementById('fileList').innerHTML = '';
    groupSelect.value = 'Y&S Group';
    customGroupWrap.style.display = 'none';
    customGroup.value = '';
    document.getElementById('asOfDate').value = today;
    resultsDiv.style.display = 'none';
    resultsDiv.innerHTML = '';
    checkReady();
  });

  processBtn.addEventListener('click', async () => {
    if (!invoiceFile) return;

    const groupName = groupSelect.value === 'Other'
      ? (customGroup.value.trim() || 'Other')
      : groupSelect.value;
    const asOfDate = document.getElementById('asOfDate').value;

    processBtn.disabled = true;
    btnLabel.textContent = 'Generating…';
    spinner.style.display = 'block';
    resultsDiv.style.display = 'none';
    resultsDiv.innerHTML = '';

    const fd = new FormData();
    fd.append('invoices',     invoiceFile);
    fd.append('group_name',   groupName);
    fd.append('as_of_date',   asOfDate);

    try {
      const resp = await fetch('/process', { method: 'POST', body: fd });
      const d    = await resp.json();
      if (!resp.ok || d.error) {
        resultsDiv.innerHTML = `<div class="error-item"><p><strong>Error:</strong> ${d.error || 'Processing failed.'}</p></div>`;
      } else {
        resultsDiv.innerHTML = `
          <div class="download-wrap">
            <div class="report-meta">
              <span><strong>${d.row_count.toLocaleString()}</strong> invoices</span>
              <span>Grand total: <strong>${money(d.grand_total)}</strong></span>
            </div>
            <a class="btn-download" href="${d.download_url}">⬇ Download ${d.filename}</a>
          </div>`;
      }
      resultsDiv.style.display = 'block';
    } catch (err) {
      resultsDiv.innerHTML = `<div class="error-item"><p><strong>Network error:</strong> ${err.message}</p></div>`;
      resultsDiv.style.display = 'block';
    } finally {
      processBtn.disabled = false;
      btnLabel.textContent = 'Generate Report';
      spinner.style.display = 'none';
    }
  });
</script>
</body>
</html>
